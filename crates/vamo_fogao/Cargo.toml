[package]
name = "vamo_fogao"
description = "O executável vamo: a CLI, a TUI e o servidor MCP do vamo_fogao."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# O pacote se chama vamo_fogao, mas o comando é curto: `vamo`.
[[bin]]
name = "vamo"
path = "src/main.rs"

[features]
# O Google Agenda como fonte da agenda, pela API e com login. Desligada por
# padrão: o link ICS não pede nada disso.
google = ["vamo-agenda/google"]

[dependencies]
clap.workspace = true
color-eyre.workspace = true
etcetera.workspace = true
# Aqui o jiff precisa dos fusos, pra mostrar os horários na hora local.
jiff = { workspace = true, features = ["tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
# Só o leitor, pra config.
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# O `v7` traz o gerador de UUID v7, com relógio e sorteio.
uuid = { workspace = true, features = ["v7"] }
vamo-acervo.workspace = true
vamo-agenda.workspace = true
vamo-core.workspace = true
vamo-store.workspace = true
vamo-tui.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true

[lints]
workspace = true

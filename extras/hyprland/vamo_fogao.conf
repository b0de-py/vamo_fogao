# O vamo_fogao à mão no Hyprland: um atalho mostra e esconde a TUI.
#
# A TUI mora num workspace especial, o `special:vamo`. Esconder o
# workspace não fecha o processo, então a tela volta do jeito que estava.
# Na primeira vez que o workspace abre vazio, o Hyprland abre a TUI.
#
# Pra usar, copie este arquivo pra ~/.config/hypr/ e ponha no fim do
# hyprland.conf:
#
#   source = ~/.config/hypr/vamo_fogao.conf
#
# A sintaxe das regras de janela é a do Hyprland 0.53 em diante.

# O atalho. Antes de usar, confira se ele está livre: hyprctl binds
bind = SUPER ALT, F, togglespecialworkspace, vamo

# O terminal que abre a TUI. A classe `vamo_fogao` é o que as regras de
# janela abaixo procuram. No Alacritty e no Kitty é `--class vamo_fogao`;
# no Ghostty, `--class=vamo.fogao` (ele pede um ID com ponto) e as regras
# abaixo mudam pra `vamo.fogao`.
workspace = special:vamo, on-created-empty:uwsm app -- alacritty --class vamo_fogao -e vamo tui

# O tamanho: uma janela flutuante grande, no meio da tela, por cima do
# que estiver aberto. Pra tela cheia, comente esta regra: sozinha no
# workspace especial, a janela ocupa a tela toda.
windowrule = float on, center on, size (monitor_w*0.9) (monitor_h*0.85), match:class vamo_fogao

notas = "A página de história do clube na Wikipédia põe Zagallo entre os campeões de 1958, mas na Copa ele ainda era do Flamengo. Ela também dá a Garrincha cinco companheiros de clube em 1962, quando a lista de convocados tem cinco do Botafogo contando com ele."


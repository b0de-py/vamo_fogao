name: Tarefa
description: Uma tarefa de fase, no formato do projeto (o que é e quando fica pronta).
body:
  - type: markdown
    attributes:
      value: |
        Uma tarefa por issue, com título começando por verbo no infinitivo ("Criar a tela Museu"). Depois de criada, ela entra como sub-issue do épico da fase.
  - type: textarea
    id: o-que-e
    attributes:
      label: O que é
      description: O que a tarefa entrega e os detalhes que importam.
    validations:
      required: true
  - type: textarea
    id: pronto-quando
    attributes:
      label: Pronto quando
      description: Os critérios que dizem que a tarefa acabou. Teste conta.
      placeholder: "- Testes cobrem os casos de borda."
    validations:
      required: true

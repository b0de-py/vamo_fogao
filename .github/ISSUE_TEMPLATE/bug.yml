name: Bug
description: Algo no vamo_fogao não funciona como deveria.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        O repositório é público. Antes de enviar, confira se não tem dado pessoal (tarefa, evento da agenda, nome) no que você colou.
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
      description: O que você fez e o que o vamo_fogao fez.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que era pra acontecer
    validations:
      required: true
  - type: textarea
    id: reproduzir
    attributes:
      label: Como reproduzir
      description: Os passos, do começo. Se tiver comando, cole o comando e a saída.
  - type: input
    id: versao
    attributes:
      label: Versão
      description: A saída de `vamo --version`.
      placeholder: vamo 0.1.0
    validations:
      required: true
  - type: input
    id: sistema
    attributes:
      label: Sistema
      description: Distribuição, terminal e, se for coisa de janela, o compositor.
      placeholder: Omarchy, Alacritty, Hyprland

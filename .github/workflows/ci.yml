# A CI do vamo_fogao: o que estiver abaixo do padrão para aqui, antes de
# chegar na main. Cada job roda os mesmos comandos do ./scripts/checar.sh,
# então dá pra reproduzir qualquer falha na sua máquina.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# O token da CI só lê o repositório.
permissions:
  contents: read

# Push novo num PR cancela a execução antiga do mesmo PR. Na main, toda
# execução vai até o fim.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Build incremental não ajuda numa máquina que nasce limpa e só engorda o cache.
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Formatação
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Instalar o Rust do rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Instalar o Rust do rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Testes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Instalar o Rust do rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9
      - run: cargo nextest run --workspace --all-features --locked
      # O nextest não roda os exemplos da doc; o cargo test cuida deles.
      - run: cargo test --doc --workspace --all-features --locked

  doc:
    name: Documentação
    runs-on: ubuntu-24.04
    env:
      # Link quebrado ou doc mal formada vira erro.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Instalar o Rust do rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked

  deny:
    name: Dependências
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Instalar o Rust do rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20
      - run: cargo deny --locked check

  livro:
    name: Livro
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # O `mdbook test` compila os exemplos do livro com o rustdoc.
      - name: Instalar o Rust do rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5
      - run: mdbook build book
      - run: mdbook test book
